name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本号升级方式（自动更新 CHANGELOG 并提交回 main）"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none
  issues:
    types: [closed]

permissions:
  contents: write
  pull-requests: write # bump 步骤需要建 PR 并合并（main 受分支保护，bot 不能直推）

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.18.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Bump version & changelog (via auto-merged PR)
        id: bump
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/bump-version.mjs "$BUMP"
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          BRANCH="chore/release-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git push -u origin "$BRANCH"
          gh pr create --title "chore: release v$VERSION" --body "自动版本号升级（release 工作流）" --base main --head "$BRANCH"
          gh pr merge --squash --delete-branch "$BRANCH"
          # 切到合并后的 main 提交，后续构建和打 tag 都基于它
          git fetch origin main
          git checkout --detach origin/main

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            TAG="v$(node -p "require('./apps/desktop/package.json').version")-issue${{ github.event.issue.number }}"
          elif [ -n "${{ steps.bump.outputs.tag }}" ]; then
            TAG="${{ steps.bump.outputs.tag }}"
          else
            TAG="v$(node -p "require('./apps/desktop/package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Build desktop installer (Tauri)
        # createUpdaterArtifacts 只在发布构建时开启：它要求签名私钥，
        # 留在默认配置里会导致本地无密钥时 desktop:build 失败
        run: pnpm --filter skill-helm-desktop exec tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          # updater 签名私钥，存于仓库 Secrets；对应公钥写死在 tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate updater manifest (latest.json)
        run: node .github/scripts/gen-latest-json.mjs "${{ steps.release_tag.outputs.tag }}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Skill Helm ${{ steps.release_tag.outputs.tag }}
          # issue 触发的构建标记为 prerelease，避免抢占 releases/latest（updater 端点）
          prerelease: ${{ github.event_name == 'issues' }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
