name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本号升级方式（自动更新 CHANGELOG 并提交回 main）"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none
  issues:
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Bump version & changelog
        id: bump
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          node .github/scripts/bump-version.mjs "$BUMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json CHANGELOG.md
          git commit -m "chore: release v$(node -p "require('./apps/desktop/package.json').version")"
          git push

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            TAG="v$(node -p "require('./apps/desktop/package.json').version")-issue${{ github.event.issue.number }}"
          elif [ -n "${{ steps.bump.outputs.tag }}" ]; then
            TAG="${{ steps.bump.outputs.tag }}"
          else
            TAG="v$(node -p "require('./apps/desktop/package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Build desktop installer (Tauri)
        run: pnpm --filter skill-helm-desktop desktop:build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Skill Helm ${{ steps.release_tag.outputs.tag }}
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
