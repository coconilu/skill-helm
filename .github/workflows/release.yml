name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（留空则取 apps/desktop/package.json 的版本号，如 v0.1.0）"
        required: false
        type: string
  issues:
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            TAG="v$(node -p "require('./apps/desktop/package.json').version")-issue${{ github.event.issue.number }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$(node -p "require('./apps/desktop/package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Build desktop installer (Tauri)
        run: pnpm --filter skill-helm-desktop desktop:build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Skill Helm ${{ steps.release_tag.outputs.tag }}
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
