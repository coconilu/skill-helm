[package]
name = "skill-helm-desktop"
version = "0.1.0"
edition = "2021"
description = "Skill Helm 桌面端"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
# tauri-plugin-updater 以 default-features = false 依赖 reqwest 0.13，只开 json/stream，
# 未开启 system-proxy（reqwest 默认特性之一），导致应用不感知 Windows 注册表系统代理，
# 直连 GitHub 在代理/受限网络下 30s 超时（实测：走 127.0.0.1 代理 2.8s 返回，直连 21s 连接超时）。
# 这里显式声明 reqwest 并开启 system-proxy；Cargo feature 统一会作用到插件共享的 reqwest 实例，
# 恢复系统代理自动探测。
reqwest = { version = "0.13", default-features = false, features = ["system-proxy"] }
serde_json = "1"
